name: BugReport
version: 1.0-SNAPSHOT
main: org.example.Main
api-version: '1.21'
softdepend:
  - DiscordSRV
commands:
  bug:
    description: Report an issue to staff via Discord
    usage: /bug <message> | /bug version
  bugreport:
    description: BugReport administration command
    usage: /bugreport reload
permissions:
  bugreport.reload:
    description: Allows reloading BugReport config in-game
    default: op

